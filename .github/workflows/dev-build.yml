# Builds the node on every push to main and publishes it as the rolling
# pre-release "dev". scripts/update-dev.sh installs it into an n8n container.
# The tag "dev" does not match the npm publish trigger (*.*.*).

name: Dev build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  dev-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Run lint
        run: 'npm run lint'

      - name: Run build
        run: 'npm run build'

      - name: Run tests
        run: 'npm test'

      - name: Package build
        run: |
          printf 'commit: %s\nbuilt: %s\n' "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/BUILD_INFO
          tar -czf n8n-nodes-ameise-dist.tar.gz -C dist --exclude=tsconfig.tsbuildinfo .

      - name: Update dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f dev
          git push -f origin refs/tags/dev
          notes="Development build of ${GITHUB_SHA::7}. Install with scripts/update-dev.sh, see README."
          if gh release view dev >/dev/null 2>&1; then
            gh release upload dev n8n-nodes-ameise-dist.tar.gz --clobber
            gh release edit dev --prerelease --notes "$notes"
          else
            gh release create dev n8n-nodes-ameise-dist.tar.gz --prerelease --title "Development build" --notes "$notes"
          fi
